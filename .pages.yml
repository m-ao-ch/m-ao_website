# Pages CMS configuration — https://pagescms.org
# Defines the editing form for content.json. Project numbers are set here (empty = automatic); publication numbers are automatic.
media:
  input: media
  output: media

content:
  - name: site
    label: MAO website
    description: "Everything shown on m-ao.ch. Save, and the site updates within a minute or two."
    type: file
    path: content.json
    fields:

      - name: site
        label: Site (title, link preview, icon)
        description: "The tab title applies right away; the link preview (WhatsApp, iMessage, mail…) updates on the next publish. Messaging apps can keep an old preview cached for a while."
        type: object
        fields:
          - name: title
            label: Tab title
            description: "Shown on the browser tab and in search results."
            type: string
          - name: previewTitle
            label: Link preview — title
            type: string
          - name: previewDescription
            label: Link preview — text
            type: text
          - name: previewImage
            label: Link preview — image
            description: "Ideally 1200 × 630 px (PNG or JPG)."
            type: image
          - name: icon
            label: Icon (browser tab)
            description: "Square image, at least 180 × 180 px (PNG)."
            type: image
          - name: wordmarkWeight
            label: MAO — weight
            description: "How heavy the letters are. The operator (+ × − ÷) follows in proportion."
            type: select
            options:
              values:
                - { value: "700", label: "Bold" }
                - { value: "800", label: "Extra Bold" }
                - { value: "900", label: "Black (current)" }
          - name: wordmarkSize
            label: MAO — size
            description: "Relative to the size the site calculates for each screen. Texts keep their size."
            type: select
            options:
              values:
                - { value: "80", label: "80 %" }
                - { value: "90", label: "90 %" }
                - { value: "100", label: "100 % (current)" }
                - { value: "110", label: "110 %" }
          - name: url
            label: Site address
            description: "Leave as https://www.m-ao.ch"
            type: string

      - name: projects
        label: Projects (×)
        description: "Shown on the wheel, in this order. Drag to reorder."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.number} {fields.title} — {fields.place}"
        fields:
          - name: number
            label: Number
            description: "e.g. 01, 07, 12. Leave empty to number automatically by position."
            type: string
          - name: title
            label: Title
            type: string
            required: true
          - name: type
            label: Type
            description: "e.g. Installation, Public Design Study"
            type: string
          - name: place
            label: Place
            type: string
          - name: year
            label: Year
            description: "Shown only when zoomed in"
            type: string

      - name: publications
        label: Publications (÷)
        description: "Sorted by date automatically, newest first. The month places it on the timeline."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.outlet} — {fields.title} ({fields.year})"
        fields:
          - name: outlet
            label: Publisher / journal
            type: string
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: year
            label: Year
            type: number
            required: true
          - name: month
            label: Month (1–12)
            type: number
            required: true
            options:
              min: 1
              max: 12

      - name: about
        label: About (−)
        description: "One entry per paragraph."
        type: text
        list:
          min: 1
          collapsible:
            collapsed: false

      - name: contact
        label: Contact (+)
        type: object
        fields:
          - name: email
            label: Email
            type: string
          - name: offices
            label: Offices
            description: "First = left column (under the M), second = right column (under the O)."
            type: object
            list:
              min: 1
              max: 2
              collapsible:
                collapsed: true
                summary: "{fields.label} {fields.place}"
            fields:
              - name: label
                label: Label
                description: "e.g. Swiss office:"
                type: string
              - name: phone
                label: Phone
                type: string
              - name: place
                label: Place line
                description: "e.g. Locarno – TI – CH"
                type: string
              - name: map
                label: Map search
                description: "What to search on the map when zoomed in, e.g. Locarno, Switzerland"
                type: string
